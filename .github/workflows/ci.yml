name: CI Pipeline

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: Secret Verification (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: .
          base: main
          head: HEAD

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          failure-threshold: error
          recursive: true

  grype-sbom:
    name: Vulnerability Scan & SBOM (Grype + Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Grype (filesystem scan)
        uses: anchore/scan-action@v7
        continue-on-error: true
        with:
          path: "."
          output-format: "sarif"
          output-file: "grype-results.sarif"
          severity-cutoff: high
          fail-build: false
      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-fs
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: "."
          format: "cyclonedx-json=sbom.cdx.json"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "0"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/typescript
      # NOTE: this job does not currently produce SARIF. `generate-sarif` is not
      # an input of semgrep/semgrep-action@v1 (it warned "Unexpected input(s)"
      # and was ignored), and the action's `args` input is forwarded to
      # `docker run` as container arguments rather than appended to `semgrep ci`
      # -- passing --sarif there fails with `exec: "--sarif": executable file
      # not found in $PATH`. Emitting SARIF needs semgrep invoked directly.
      #
      # The scan itself is the gate and still fails on findings. The upload is
      # conditional so a missing report can never fail an otherwise clean job.
      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test-shared-secrets:
    name: Shared Secrets Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install and smoke-test shared-secrets
        run: |
          python -m pip install -e ./shared
          python - <<'EOF'
          import os, tempfile
          from shared_secrets import read_secret, read_file_secret, MissingSecretError
          assert read_secret('CI_DISABLED', required=False, default='x') == 'x'
          try:
              read_secret('CI_SHOULD_NOT_EXIST_XYZ', required=True)
              raise SystemExit('required secret did not raise')
          except MissingSecretError:
              pass
          with tempfile.NamedTemporaryFile('w', delete=False) as fh:
              fh.write('secret-from-file')
              fh.flush()
          os.environ['CI_TEST_FILE'] = fh.name
          assert read_secret('CI_TEST') == 'secret-from-file'
          assert read_file_secret(fh.name) == 'secret-from-file'
          print('shared-secrets OK')
          EOF

  lint-runbooks:
    name: Runbook & Ops Script Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Lint runbook freshness
        run: |
          python scripts/check-runbooks.py

      - name: Smoke-test the backup planner (dry run)
        env:
          TENANT_DATABASES_JSON: '{"org-a":{"db-1":"postgresql+asyncpg://drill:secret@host:5432/prod","db-2":"sqlite+aiosqlite:///:memory:"},"org-b":{"db-1":{"connection_string":"postgresql://read:secret@replica:5432/other","replica_connection_string":"postgresql://read:secret@replica:5432/other"}}}'
        run: |
          python3 -m py_compile scripts/backup-databases.py
          [ "$(python3 scripts/backup-databases.py --dry-run | grep -c '\[PLAN\]')" = "3" ] || exit 1
          [ "$(python3 scripts/backup-databases.py --dry-run --include-replicas | grep -c '\[PLAN\]')" = "4" ] || exit 1
          echo "backup planner resolves 3 targets by default, 4 with --include-replicas"

      - name: Syntax-check ops shell scripts
        run: |
          bash -n scripts/probe-production.sh
          bash -n scripts/incident-start.sh
          bash -n scripts/drills/drill-db-outage.sh
          bash -n scripts/drills/drill-rollback.sh
          bash -n scripts/drills/drill-restore.sh

  test-sql-query-api:
    name: SQL Query API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd sql_query_api
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock httpx aiosqlite
          # Security tools
          python -m pip install bandit pip-audit

      - name: Run Bandit
        run: |
          cd sql_query_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc --ignore-vuln PYSEC-2026-1325

      - name: Run pytest
        run: |
          cd sql_query_api
          pytest

  test-auth0-api:
    name: Auth0 API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd auth0_api
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock pytest-cov httpx bandit pip-audit

      - name: Run Bandit
        run: |
          cd auth0_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc --ignore-vuln PYSEC-2026-1325

      - name: Run pytest
        run: |
          cd auth0_api
          pytest

  test-web-app:
    name: Web App Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies
        run: |
          cd web-app
          npm ci --ignore-scripts

      - name: Run npm audit (dependency vulnerability gate)
        run: |
          cd web-app
          npm audit --audit-level=moderate

      - name: Run lint
        run: |
          cd web-app
          npm run lint

      - name: Run tests
        run: |
          cd web-app
          npm test

      - name: Install Playwright browsers
        run: |
          cd web-app
          npx playwright install --with-deps chromium

      - name: Run E2E Playwright tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Build web-app
        run: |
          cd web-app
          npm run build

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    # TODO: this job has never once succeeded - across 12+ runs it has only ever
    # been "failure" or "skipped" - and it detects nothing today. Marked
    # non-blocking so a permanently red X cannot train reviewers to ignore the
    # rest of CI.
    #
    # It enforced nothing even while failing, because the scan step below
    # already carries `continue-on-error: true`. So this costs no coverage.
    # It is NOT a claim that the web surface is scanned; nothing is scanning it.
    #
    # To make this real, in order:
    #   1. Bootstrap the stack. `docker compose up` currently aborts with
    #      "env file .env not found". Needs .env from .env.example (via
    #      scripts/bootstrap-dev.sh), mkcert certs for the ./certs mount, and
    #      the secrets/pg_rotator_admin_pass.txt file creds-rotator mounts.
    #   2. Wait on real health, not `sleep 30` - the API services must pass
    #      /readyz before a scan is meaningful.
    #   3. Note that sql_query_api refuses to start with ENVIRONMENT=production
    #      and no OPA_URL, so CI env must set OPA_URL or use a non-production
    #      ENVIRONMENT for the DAST stack.
    #   4. Drop `continue-on-error: true` from the scan step so findings block,
    #      and triage whatever the first real scan reports.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start application stack for DAST
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
          # Wait for services to be healthy
          sleep 30
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://localhost:8443"
          cmd_options: "-a"
        continue-on-error: true
      - name: Upload ZAP Results
        uses: github/codeql-action/upload-sarif@v3
        # Only when a report exists, so a missing artifact cannot be mistaken
        # for the scan itself having failed.
        if: always() && hashFiles('zap-report.sarif') != ''
        with:
          sarif_file: zap-report.sarif
          category: zap-dast
