# Production deployment override for the stack in docker-compose.yml.
#
# Images are pre-built and pushed to GHCR by .github/workflows/docker.yml; the
# production host never builds. Rollback = re-run with IMAGE_TAG pinned to an
# older tag. Secrets stay out of this file and out of the pipeline: the host
# injects them from GATEWAY_ENV_FILE (default /etc/gateway/gateway.env).
#
# Usage on the production host (see DOCKER_README.md, "Automated deployment"):
#   export GATEWAY_ENV_FILE=/etc/gateway/gateway.env
#   export IMAGE_TAG=v1.2.3                     # or latest
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#       up -d --no-build --wait --wait-timeout 300

services:
  nginx:
    image: nginx:alpine
    ports: !override
      - "80:80"
      - "443:443"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  auth0_api:
    image: ${IMAGE_BASE:-ghcr.io/keniz01/secure-db-access-gateway}/auth0-api:${IMAGE_TAG:-latest}
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}

  sql_query_api:
    image: ${IMAGE_BASE:-ghcr.io/keniz01/secure-db-access-gateway}/sql-query-api:${IMAGE_TAG:-latest}
    environment:
      OPA_ENABLED: "true"
      OPA_URL: http://opa:8181

  opa:
    # Prod: hot-reload via bundle with offline-boot fallback.
    # Keep policies/data.json mounts so OPA can start if bundle server
    # is temporarily unavailable (fail-closed only on policy evaluation,
    # not boot). See sql_query_api/opa/config.yaml:25-27.
    volumes: !override
      - ./sql_query_api/opa/policies:/etc/opa/policies:ro
      - ./sql_query_api/opa/data.json:/etc/opa/data.json:ro
      - ./sql_query_api/opa/config.yaml:/etc/opa/config.yaml:ro
    command: !override
      - "run"
      - "--server"
      - "--config-file=/etc/opa/config.yaml"
      - "--addr=:8181"
      - "--log-level=info"
    environment:
      BUNDLE_SERVICE_URL: ${BUNDLE_SERVICE_URL:-http://opa-bundle-server:8080}

  # Uncomment to serve bundles from the host in prod without external storage:
  # opa-bundle-server:
  #   image: nginx:alpine
  #   networks:
  #     - backend
  #   volumes:
  #     - ./sql_query_api/bundle.tar.gz:/usr/share/nginx/html/bundle.tar.gz:ro

  web_app:
    image: ${IMAGE_BASE:-ghcr.io/keniz01/secure-db-access-gateway}/web-app:${IMAGE_TAG:-latest}
    # The SPA is served through the nginx TLS edge; no host port for the dev server.
    ports: !override []
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://app.secure-db-access-gateway.org}
      VITE_SQL_GRAPHQL_BASE_URL: ${VITE_SQL_GRAPHQL_BASE_URL:-https://app.secure-db-access-gateway.org/api/graphql}
