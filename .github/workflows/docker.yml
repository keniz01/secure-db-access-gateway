name: Build and Push Images

# Build and push edge/SHA images on main; an optional tag is available via
# workflow_dispatch. Release builds use the same pinned builder from deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit GHCR tag to push (default: edge + sha-<commit>)"
        required: false
        type: string

permissions: {}

jobs:
  build:
    name: Build and push images
    # Keep this SHA aligned with deploy.yml; update both only after reviewing
    # the builder. It must stay reachable from a ref (an ancestor of main):
    # GitHub resolves `uses:` by ref reachability, so a pin whose only branch
    # was deleted after merge fails every run with "workflow was not found".
    uses: keniz01/secure-db-access-gateway/.github/workflows/docker-builder.yml@d70cd0f2e6781831570c7d5877cd8cca4a178d6f
    with:
      tag: ${{ inputs.tag }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
