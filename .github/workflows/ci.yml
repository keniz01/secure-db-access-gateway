name: CI Pipeline

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]

jobs:
  test-sql-query-api:
    name: SQL Query API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd sql_query_api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock httpx aiosqlite

      - name: Run pytest
        run: |
          cd sql_query_api
          pytest

  test-auth0-api:
    name: Auth0 API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          cd auth0_api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov httpx

      - name: Run pytest
        run: |
          cd auth0_api
          pytest

  test-web-app:
    name: Web App Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies
        run: |
          cd web-app
          npm ci

      - name: Run lint
        run: |
          cd web-app
          npm run lint

      - name: Run tests
        run: |
          cd web-app
          npm test

      - name: Install Playwright browsers
        run: |
          cd web-app
          npx playwright install --with-deps chromium

      - name: Run E2E Playwright tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Build web-app
        run: |
          cd web-app
          npm run build
