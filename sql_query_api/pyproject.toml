[project]
name = "music-findr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.121.1",
    "greenlet>=3.2.4",
    "loguru>=0.7.3",
    "punq>=0.7.0",
    "sqlalchemy>=2.0.44",
    "sqlparse>=0.5.3",
    "starlette>=0.49.3",
    "strawberry-graphql[debug-server,fastapi]>=0.284.2",
    "uvicorn>=0.38.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = []
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
    "S",
    "B",
    "C4",
    "T20",
    "SIM",
    "F401",
    "W291",
    "PD002", "PD003", "PD004",
]

ignore = [
    "D107", "D100", "D104",
    "D203", "D212", "D205",
    "ANN204",
]

[pydocstyle]
convention = "google"

[mccabe]
max-complexity = 10
