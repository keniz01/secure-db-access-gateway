name: CI Pipeline

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: Secret Verification (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: .
          base: main
          head: HEAD

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          failure-threshold: error
          recursive: true

  security-exception-policy:
    name: Security Exception Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"
      - name: Validate security exception register
        run: python scripts/check-security-exceptions.py
      - name: Negative test - the gate must reject an unregistered downgrade
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/negwf"
          printf 'jobs:\n  probe:\n    runs-on: ubuntu-latest\n    continue-on-error: true\n    steps:\n      - run: "true"\n' > "$RUNNER_TEMP/negwf/downgrade.yml"
          # An empty register, so the only thing that can fail is the
          # unregistered `probe` job. Pointed at the real register this fixture
          # would also report the zap-dast entries as stale, and the test would
          # pass for the wrong reason.
          printf 'version: 1\nexceptions: []\n' > "$RUNNER_TEMP/neg-register.yml"
          set +e
          python scripts/check-security-exceptions.py \
            --workflows "$RUNNER_TEMP/negwf" \
            --register "$RUNNER_TEMP/neg-register.yml" > "$RUNNER_TEMP/neg.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/neg.log"
          if [ "$rc" -eq 0 ]; then
            echo "::error::the gate accepted an unregistered non-blocking control"
            exit 1
          fi
          # Assert on the exit code plus the exact control id, not on a
          # substring of a human-readable sentence that a reword would break.
          grep -q "non-blocking control .probe. has no registered exception" "$RUNNER_TEMP/neg.log" || {
            echo "::error::the gate failed for the wrong reason"
            exit 1
          }
          grep -q "stale" "$RUNNER_TEMP/neg.log" && {
            echo "::error::fixture produced stale-entry errors; it is not isolated"
            exit 1
          }
          echo "gate correctly rejects an unregistered downgrade"

  grype-sbom:
    name: Vulnerability Scan & SBOM (Grype + Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Grype (filesystem scan)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        # Blocking. Downgrading this control requires a registered, owned and
        # expiring entry in .github/security-exceptions.yml; see
        # scripts/check-security-exceptions.py.
        with:
          path: "."
          output-format: "sarif"
          output-file: "grype-results.sarif"
          severity-cutoff: high
          fail-build: true
      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-fs
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        # Blocking: a silently missing SBOM is a silently missing supply-chain
        # artifact, which is the failure mode this step exists to prevent.
        with:
          path: "."
          # Do not embed the filename in `format`. sbom-action parses `format`
          # to work out where its output landed, so
          # `cyclonedx-json=sbom.cdx.json` made it report "No Syft output" after
          # a scan that had in fact succeeded. The misconfiguration was on main
          # and was masked there by `continue-on-error: true`; 0950383 removed
          # that mask, so from that commit the step failed visibly instead.
          format: "cyclonedx-json"
          # output-file writes into the workspace, which is what the blocking
          # upload step below reads. artifact-name alone only labels the
          # action's own artifact in the runner temp dir.
          output-file: "sbom.cdx.json"
          # The explicit upload step below owns retention, so do not let the
          # action publish a second copy with its own default retention.
          upload-artifact: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
          # Default is `warn`, which would let a missing SBOM pass silently.
          if-no-files-found: error

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Blocking. Downgrading this control requires a registered, owned and
        # expiring entry in .github/security-exceptions.yml.
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/typescript
      # NOTE: this job does not currently produce SARIF. `generate-sarif` is not
      # an input of semgrep/semgrep-action@v1 (it warned "Unexpected input(s)"
      # and was ignored), and the action's `args` input is forwarded to
      # `docker run` as container arguments rather than appended to `semgrep ci`
      # -- passing --sarif there fails with `exec: "--sarif": executable file
      # not found in $PATH`. Emitting SARIF needs semgrep invoked directly.
      #
      # The scan itself is the gate and still fails on findings. The upload is
      # conditional so a missing report can never fail an otherwise clean job.
      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test-shared-secrets:
    name: Shared Secrets Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install and smoke-test shared-secrets
        run: |
          python -m pip install -e ./shared
          python - <<'EOF'
          import os, tempfile
          from shared_secrets import read_secret, read_file_secret, MissingSecretError
          assert read_secret('CI_DISABLED', required=False, default='x') == 'x'
          try:
              read_secret('CI_SHOULD_NOT_EXIST_XYZ', required=True)
              raise SystemExit('required secret did not raise')
          except MissingSecretError:
              pass
          with tempfile.NamedTemporaryFile('w', delete=False) as fh:
              fh.write('secret-from-file')
              fh.flush()
          os.environ['CI_TEST_FILE'] = fh.name
          assert read_secret('CI_TEST') == 'secret-from-file'
          assert read_file_secret(fh.name) == 'secret-from-file'
          print('shared-secrets OK')
          EOF

  lint-runbooks:
    name: Runbook & Ops Script Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Lint runbook freshness
        run: |
          python scripts/check-runbooks.py

      - name: Smoke-test the backup planner (dry run)
        env:
          TENANT_DATABASES_JSON: '{"org-a":{"db-1":"postgresql+asyncpg://drill:secret@host:5432/prod","db-2":"sqlite+aiosqlite:///:memory:"},"org-b":{"db-1":{"connection_string":"postgresql://read:secret@replica:5432/other","replica_connection_string":"postgresql://read:secret@replica:5432/other"}}}'
        run: |
          python3 -m py_compile scripts/backup-databases.py
          [ "$(python3 scripts/backup-databases.py --dry-run | grep -c '\[PLAN\]')" = "3" ] || exit 1
          [ "$(python3 scripts/backup-databases.py --dry-run --include-replicas | grep -c '\[PLAN\]')" = "4" ] || exit 1
          echo "backup planner resolves 3 targets by default, 4 with --include-replicas"

      - name: Syntax-check ops shell scripts
        run: |
          bash -n scripts/probe-production.sh
          bash -n scripts/incident-start.sh
          bash -n scripts/drills/drill-db-outage.sh
          bash -n scripts/drills/drill-rollback.sh
          bash -n scripts/drills/drill-restore.sh

  test-sql-query-api:
    name: SQL Query API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd sql_query_api
          python -m pip install --upgrade pip
          # Install exactly what the Dockerfiles install, via uv.lock. A bare
          # `pip install -e .` re-resolves to whatever is newest on PyPI, so
          # pip-audit graded a dependency set that is never shipped and the
          # lockfile stayed decorative.
          pip install "uv==0.12.22"
          uv export --locked --no-emit-project \
            --no-emit-package shared-secrets -o /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
          python -m pip install -e .
          # The locked export above already provides pytest, pytest-asyncio,
          # pytest-mock, httpx and aiosqlite. Installing them again unpinned
          # would upgrade the locked set and make pip-audit grade something
          # other than what the images ship. Only the scanners are added here.
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"

      - name: Run Bandit
        run: |
          cd sql_query_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd sql_query_api
          pytest

  test-auth0-api:
    name: Auth0 API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd auth0_api
          python -m pip install --upgrade pip
          # Install exactly what the Dockerfiles install, via uv.lock. A bare
          # `pip install -e .` re-resolves to whatever is newest on PyPI, so
          # pip-audit graded a dependency set that is never shipped and the
          # lockfile stayed decorative.
          pip install "uv==0.12.22"
          uv export --locked --no-emit-project \
            --no-emit-package shared-secrets -o /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
          python -m pip install -e .
          # See the SQL job above: the locked export already provides the test
          # tooling, so only the scanners are added here.
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"

      - name: Run Bandit
        run: |
          cd auth0_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd auth0_api
          pytest

  test-web-app:
    name: Web App Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies
        run: |
          cd web-app
          npm ci --ignore-scripts

      - name: Run npm audit (dependency vulnerability gate)
        run: |
          cd web-app
          npm audit --audit-level=moderate

      - name: Run lint
        run: |
          cd web-app
          npm run lint

      - name: Run tests
        run: |
          cd web-app
          npm test

      - name: Install Playwright browsers
        run: |
          cd web-app
          npx playwright install --with-deps chromium

      - name: Run E2E Playwright tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Build web-app
        run: |
          cd web-app
          npm run build

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    # TODO: this job has never once succeeded - across 12+ runs it has only ever
    # been "failure" or "skipped" - and it detects nothing today. Marked
    # non-blocking so a permanently red X cannot train reviewers to ignore the
    # rest of CI.
    #
    # It enforced nothing even while failing, because the scan step below
    # already carries `continue-on-error: true`. So this costs no coverage.
    # It is NOT a claim that the web surface is scanned; nothing is scanning it.
    #
    # This downgrade is registered as SEC-EXC-001 in .github/security-exceptions.yml
    # (owner: Platform Security, expires 2026-12-01). The register is enforced by
    # scripts/check-security-exceptions.py, so this cannot quietly outlive it.
    #
    # To make this real, in order:
    #   1. Bootstrap the stack. `docker compose up` aborts with
    #      "env file .env not found". Partially handled by
    #      scripts/bootstrap-dev.sh, which COPY-creates .env from .env.example
    #      (override the path with GATEWAY_ENV_FILE) and mkcert-generates
    #      certs/. Two gaps remain for CI:
    #        a. `mkcert -install` writes the CA into the OS trust store and
    #           prompts for an admin password, so it cannot run unattended.
    #           CI needs certs generated another way, or ZAP pointed at
    #           http://nginx:80 via the plaintext /nginx-health surface.
    #        b. compose also requires secrets/pg_rotator_admin_pass.txt for the
    #           creds-rotator service, and bootstrap-dev.sh does NOT create it.
    #           Either commit a throwaway CI-only value or drop creds-rotator
    #           from the CI overlay.
    #   2. Wait on real health, not `sleep 30` - the API services must pass
    #      /readyz before a scan is meaningful.
    #   3. Drop `continue-on-error: true` from the scan step so findings block,
    #      and triage whatever the first real scan reports.
    #
    # Note: this job will NOT trip the OPA production guard on the way up.
    # sql_query_api only refuses to start when ENVIRONMENT=production AND
    # OPA_URL is empty AND OPA_ENABLED is not explicitly false, and
    # docker-compose.yml already sets OPA_URL=http://opa:8181 (line 124)
    # with OPA_ENABLED=false (line 125). Do not rely on `is_ci()` here:
    # compose does not forward CI/GITHUB_ACTIONS into the container, so
    # is_ci() is False inside sql_query_api.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start application stack for DAST
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d
          # Wait for services to be healthy
          sleep 30
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "https://localhost:8443"
          cmd_options: "-a"
        continue-on-error: true
      - name: Upload ZAP Results
        uses: github/codeql-action/upload-sarif@v3
        # Only when a report exists, so a missing artifact cannot be mistaken
        # for the scan itself having failed.
        if: always() && hashFiles('zap-report.sarif') != ''
        with:
          sarif_file: zap-report.sarif
          category: zap-dast
