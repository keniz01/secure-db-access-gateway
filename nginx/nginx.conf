events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones
    # Identity claims are not available at this boundary, so use the client IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;

    # Stricter rate limit for auth endpoints: 5 requests per minute per org or IP fallback
    # Protects against brute-force attacks on login/auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Return 429 (Too Many Requests) instead of default 503
    limit_req_status 429;

    # Only upgrade to WebSocket when the client actually asks for it.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Map incoming correlation header or fall back to nginx $request_id
    map $http_x_correlation_id $temp_correlation_id {
        default $http_x_correlation_id;
        ""      $http_x_request_id;
    }

    map $temp_correlation_id $correlation_id {
        default $temp_correlation_id;
        ""      $request_id;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'cid="$correlation_id"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Proxy settings for auth0_api
    upstream auth0_api {
        server auth0_api:8001;
    }

    upstream sql_query_api {
        server sql_query_api:8002;
    }

    upstream web_app {
        server web_app:5173;
    }

    # Redirect all plaintext HTTP traffic to HTTPS.
    server {
        listen 80;
        server_name localhost;

        # Allow a lightweight health check over plaintext for load balancers.
        location = /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/web_tls_cert.pem;
        ssl_certificate_key /etc/nginx/certs/web_tls_key.pem;

        # Enforce HTTPS once the certificate is trusted.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-Correlation-ID $correlation_id always;
        add_header X-Request-ID $correlation_id always;

        # Auth endpoints with stricter rate limiting (brute-force protection)
        # These must come before the general /api location to take precedence
        location ~ ^/api/(login|auth|logout) {
            limit_req zone=auth_limit burst=3 nodelay;

            proxy_pass http://auth0_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_hide_header X-Correlation-ID;
            proxy_hide_header X-Request-ID;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_set_header X-Org-Id "";
            proxy_set_header X-Tenant-Id "";

            # Preserve cookies for session management
            proxy_cookie_path / /;
            proxy_pass_header Set-Cookie;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth0 API proxy - forwards /api/* to auth0_api service
        # General API rate limiting applies to all other /api endpoints
        location /api {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://auth0_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_hide_header X-Correlation-ID;
            proxy_hide_header X-Request-ID;
            proxy_set_header X-User-Email "";
            proxy_set_header X-User-Id "";
            proxy_set_header X-User-Role "";
            proxy_set_header X-Org-Id "";
            proxy_set_header X-Tenant-Id "";

            # Preserve cookies for session management
            proxy_cookie_path / /;
            proxy_pass_header Set-Cookie;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # SPA (web app) served through the TLS edge so the browser sees a single
        # https origin. This keeps the httpOnly Secure session cookie working across
        # login -> Auth0 -> callback (previously the SPA was split across schemes).
        location / {
            proxy_pass http://web_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Correlation-ID $correlation_id;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_hide_header X-Correlation-ID;
            proxy_hide_header X-Request-ID;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Health check for nginx itself
        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}