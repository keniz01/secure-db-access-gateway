name: Build and Push Images

# Builds the three service images and pushes them to GHCR.
#
# Triggers:
#   - push to the default branch   -> 'edge' + 'sha-<commit>' images
#   - workflow_dispatch (optional `tag` input) -> pushes an explicit tag
#   - workflow_call from deploy.yml -> release build for a v* tag (semver + latest)
#
# The production host never builds: it pulls these pre-built artifacts.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit GHCR tag to push (default: edge + sha-<commit>)"
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: "Explicit GHCR tag to push (release builds pass nothing)"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      matrix:
        service:
          - name: auth0-api
            context: .
            file: auth0_api/Dockerfile
          - name: sql-query-api
            context: .
            file: sql_query_api/Dockerfile
          - name: web-app
            context: ./web-app
            file: ./web-app/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=edge,enable=${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'https://app.secure-db-access-gateway.org' }}
            VITE_SQL_GRAPHQL_BASE_URL=${{ vars.VITE_SQL_GRAPHQL_BASE_URL || 'https://app.secure-db-access-gateway.org/api/graphql' }}
