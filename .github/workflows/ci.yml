name: CI Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@648283c3a6af4e6d946124ed7c78545715c452f37 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  test-shared-secrets:
    name: Shared Secrets Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b55fe736a7d # v5.4.0
        with:
          python-version: "3.12"

      - name: Install and smoke-test shared-secrets
        run: |
          python -m pip install -e ./shared
          python - <<'EOF'
          import os, tempfile
          from shared_secrets import read_secret, read_file_secret, MissingSecretError
          assert read_secret('CI_DISABLED', required=False, default='x') == 'x'
          try:
              read_secret('CI_SHOULD_NOT_EXIST_XYZ', required=True)
              raise SystemExit('required secret did not raise')
          except MissingSecretError:
              pass
          with tempfile.NamedTemporaryFile('w', delete=False) as fh:
              fh.write('secret-from-file')
              fh.flush()
          os.environ['CI_TEST_FILE'] = fh.name
          assert read_secret('CI_TEST') == 'secret-from-file'
          assert read_file_secret(fh.name) == 'secret-from-file'
          print('shared-secrets OK')
          EOF

  lint-runbooks:
    name: Runbook & Ops Script Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b55fe736a7d # v5.4.0
        with:
          python-version: "3.12"

      - name: Lint runbook freshness
        run: |
          python scripts/check-runbooks.py

      - name: Smoke-test the backup planner (dry run)
        env:
          TENANT_DATABASES_JSON: '{"org-a":{"db-1":"postgresql+asyncpg://drill:secret@host:5432/prod","db-2":"sqlite+aiosqlite:///:memory:"},"org-b":{"db-1":{"connection_string":"postgresql://read:secret@replica:5432/other","replica_connection_string":"postgresql://read:secret@replica:5432/other"}}}'
        run: |
          python3 -m py_compile scripts/backup-databases.py
          [ "$(python3 scripts/backup-databases.py --dry-run | grep -c '\[PLAN\]')" = "3" ] || exit 1
          [ "$(python3 scripts/backup-databases.py --dry-run --include-replicas | grep -c '\[PLAN\]')" = "4" ] || exit 1
          echo "backup planner resolves 3 targets by default, 4 with --include-replicas"

      - name: Syntax-check ops shell scripts
        run: |
          bash -n scripts/probe-production.sh
          bash -n scripts/incident-start.sh
          bash -n scripts/drills/drill-db-outage.sh
          bash -n scripts/drills/drill-rollback.sh
          bash -n scripts/drills/drill-restore.sh

  test-sql-query-api:
    name: SQL Query API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b55fe736a7d # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd sql_query_api
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock httpx aiosqlite
          # Security tools
          python -m pip install bandit pip-audit

      - name: Run Bandit
        run: |
          cd sql_query_api
          bandit -r . --severity-level medium --confidence-level medium

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd sql_query_api
          pytest

  test-auth0-api:
    name: Auth0 API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b55fe736a7d # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd auth0_api
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio pytest-mock pytest-cov httpx bandit pip-audit

      - name: Run Bandit
        run: |
          cd auth0_api
          bandit -r . --severity-level medium --confidence-level medium

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd auth0_api
          pytest

  test-web-app:
    name: Web App Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f5b2a159b43684c965f6ea35534d779b983 # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies
        run: |
          cd web-app
          npm ci --ignore-scripts

      - name: Run npm audit (dependency vulnerability gate)
        run: |
          cd web-app
          npm audit --audit-level=moderate

      - name: Run lint
        run: |
          cd web-app
          npm run lint

      - name: Run tests
        run: |
          cd web-app
          npm test

      - name: Install Playwright browsers
        run: |
          cd web-app
          npx playwright install --with-deps chromium

      - name: Run E2E Playwright tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Build web-app
        run: |
          cd web-app
          npm run build
