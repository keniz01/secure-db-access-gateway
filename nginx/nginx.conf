events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zones
    # General API rate limit: 60 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    
    # Stricter rate limit for auth endpoints: 5 requests per minute per IP
    # Protects against brute-force attacks on login/auth endpoints
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Return 429 (Too Many Requests) instead of default 503
    limit_req_status 429;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Proxy settings for auth0_api
    upstream auth0_api {
        server auth0_api:8001;
    }

    server {
        listen 80;
        server_name localhost;

        # Auth endpoints with stricter rate limiting (brute-force protection)
        # These must come before the general /api location to take precedence
        location ~ ^/api/(login|auth|logout) {
            limit_req zone=auth_limit burst=3 nodelay;
            
            proxy_pass http://auth0_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve cookies for session management
            proxy_cookie_path / /;
            proxy_pass_header Set-Cookie;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Auth0 API proxy - forwards /api/* to auth0_api service
        # General API rate limiting applies to all other /api endpoints
        location /api {
            limit_req zone=api_limit burst=20 nodelay;
            
            proxy_pass http://auth0_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Preserve cookies for session management
            proxy_cookie_path / /;
            proxy_pass_header Set-Cookie;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check for nginx itself
        location /nginx-health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}
