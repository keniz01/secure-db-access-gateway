[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-query-api"
version = "0.1.0"
description = "SQL Query API service for Secure DB Access Gateway"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.121.1",
    "greenlet>=3.2.4",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "prometheus-client>=0.22.1",
    "punq>=0.7.0",
    "pyjwt>=2.10.1",
    "cryptography>=45.0.0",
    "sqlalchemy>=2.0.44",
    "sqlparse>=0.5.3",
    "sqlglot>=30.0.0,<31",
    "starlette>=0.49.3",
    "strawberry-graphql[debug-server,fastapi]>=0.284.2",
    "shared-secrets",
    "uvicorn>=0.38.0",
]

[tool.uv.sources]
shared-secrets = { path = "../shared" }

[dependency-groups]
dev = [
    "aiosqlite>=0.20.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.14.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
namespaces = true
exclude = ["tests", "tests.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4

[tool.ruff.lint]
fixable = []
select = [
    "E", "W",
    "F",
    "I",
    "N",
    "D",
    "UP",
    "ANN",
    "S",
    "B",
    "C4",
    "T20",
    "SIM",
    "F401",
    "W291",
    "PD002", "PD003", "PD004",
]

ignore = [
    "D107", "D100", "D104",
    "D203", "D212", "D205",
    "ANN204",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",   # `assert` is the idiomatic assertion mechanism in pytest tests
    "D",      # test helpers and fixtures are not public API; no docstring requirement
    "ANN001", # un-annotated params in test fakes/fixtures are acceptable
    "ANN201", # un-annotated returns in test helpers are acceptable
    "ANN202", # un-annotated private returns in test helpers are acceptable
]

[pydocstyle]
convention = "google"

[mccabe]
max-complexity = 10
