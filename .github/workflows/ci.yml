name: CI Pipeline

permissions:
  contents: read
  security-events: write
  actions: read

on:
  push:
    branches: [ main, master, "feat/*" ]
  pull_request:
    branches: [ main, master, "feat/*" ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  trufflehog:
    name: Secret Verification (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          path: .
          base: main
          head: HEAD

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: +security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: "**/Dockerfile*"
          failure-threshold: error
          recursive: true

  security-exception-policy:
    name: Security Exception Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.3"
      - name: Validate security exception register
        run: python scripts/check-security-exceptions.py
      - name: Negative tests - the gate must reject every downgrade shape
        run: |
          set -euo pipefail
          WFDIR="$RUNNER_TEMP/negwf"
          mkdir -p "$WFDIR"
          # An empty register, so the only thing that can fail is the
          # unregistered control in the fixture. Pointed at the real register the
          # fixtures would also report its entries as stale and the tests would
          # pass for the wrong reason.
          printf 'version: 1\nexceptions: []\n' > "$RUNNER_TEMP/neg-register.yml"

          # Assert on the exit code plus the control id, not on a substring of a
          # human-readable sentence that a reword would break.
          check() {
            fixture="$1"; control_id="$2"; phrase="$3"
            rm -f "$WFDIR"/*.yml
            case "$fixture" in
              job-continue-on-error)
                printf 'jobs:\n  zap:\n    runs-on: ubuntu-latest\n    continue-on-error: true\n    steps:\n      - run: "true"\n' > "$WFDIR/$fixture.yml" ;;
              zap-fail-action-omitted)
                # fail_action defaults to false, so omitting it is a downgrade too.
                printf 'jobs:\n  dast:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Scan ZAP\n        uses: zaproxy/action-baseline@abc123\n        with:\n          target: "https://localhost:8443"\n' > "$WFDIR/$fixture.yml" ;;
              zap-fail-action-false)
                printf 'jobs:\n  dast:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Scan ZAP\n        uses: zaproxy/action-baseline@abc123\n        with:\n          fail_action: false\n' > "$WFDIR/$fixture.yml" ;;
              *)
                echo "::error::unknown fixture $fixture"; exit 1 ;;
            esac
            set +e
            python scripts/check-security-exceptions.py \
              --workflows "$WFDIR" \
              --register "$RUNNER_TEMP/neg-register.yml" > "$RUNNER_TEMP/$fixture.log" 2>&1
            rc=$?
            set -e
            cat "$RUNNER_TEMP/$fixture.log"
            if [ "$rc" -eq 0 ]; then
              echo "::error::$fixture: gate accepted a non-blocking control"
              exit 1
            fi
            grep -q "non-blocking control .$control_id. has no registered exception" "$RUNNER_TEMP/$fixture.log" || {
              echo "::error::$fixture: expected control id $control_id not reported"
              exit 1
            }
            grep -q "$phrase" "$RUNNER_TEMP/$fixture.log" || {
              echo "::error::$fixture: expected reason not reported"
              exit 1
            }
            if grep -q "stale" "$RUNNER_TEMP/$fixture.log"; then
              echo "::error::$fixture: fixture produced stale-entry errors; it is not isolated"
              exit 1
            fi
            echo "OK: $fixture rejected (control $control_id)"
          }

          # Job-level continue-on-error derives the control id from the job name.
          check job-continue-on-error "zap" "non-blocking control .zap. has no registered exception"
          check zap-fail-action-omitted "dast/Scan ZAP" "omits .fail_action."
          check zap-fail-action-false "dast/Scan ZAP" "sets .fail_action:"
          echo "gate rejects every known downgrade shape"

  opa-policy:
    name: OPA Policy (compile, format, test)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # The same image tag the compose stack runs, so this validates the policy
      # as it is actually served rather than against some other OPA version.
      - name: Validate the gateway policy
        run: |
          set -euo pipefail
          OPA=openpolicyagent/opa:1.8.0
          # fmt --fail so the committed policy is canonically formatted.
          docker run --rm -v "$PWD/sql_query_api/opa:/w:ro" --entrypoint /opa "$OPA" fmt --fail /w
          # check catches anything that does not compile at all. This is the
          # gate that was missing while gateway.rego sat broken against OPA
          # 1.8.0 - OPA crash-looped in production and nothing complained.
          docker run --rm -v "$PWD/sql_query_api/opa:/w:ro" --entrypoint /opa "$OPA" check /w
          # test runs against the whole directory so data.json is loaded as
          # data; testing policies/ alone would assert against zero policies.
          docker run --rm -v "$PWD/sql_query_api/opa:/w:ro" --entrypoint /opa "$OPA" test /w
          # build is what scripts/build-opa-bundle.sh produces for production.
          # Output goes to a mounted dir via -o: a container-local path would
          # vanish with the container, and a positional path is read as an
          # input to load rather than a destination.
          mkdir -p "$RUNNER_TEMP/opa-out"
          # --user: the image runs as a non-root uid that cannot write to a
          # runner-owned mount, which fails with "permission denied". Running as
          # the invoking user is better than chmod 777 on a temp dir.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/sql_query_api/opa:/w:ro" -v "$RUNNER_TEMP/opa-out:/out" \
            --entrypoint /opa "$OPA" build -b /w --ignore=tests -o /out/bundle.tar.gz
          test -s "$RUNNER_TEMP/opa-out/bundle.tar.gz"
          echo "bundle built: $(wc -c < "$RUNNER_TEMP/opa-out/bundle.tar.gz") bytes"

  grype-sbom:
    name: Vulnerability Scan & SBOM (Grype + Syft)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Grype (filesystem scan)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        # Blocking. Downgrading this control requires a registered, owned and
        # expiring entry in .github/security-exceptions.yml; see
        # scripts/check-security-exceptions.py.
        with:
          path: "."
          output-format: "sarif"
          output-file: "grype-results.sarif"
          severity-cutoff: high
          fail-build: true
      - name: Upload Grype results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: grype-results.sarif
          category: grype-fs
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        # Blocking: a silently missing SBOM is a silently missing supply-chain
        # artifact, which is the failure mode this step exists to prevent.
        with:
          path: "."
          # Do not embed the filename in `format`. sbom-action parses `format`
          # to work out where its output landed, so
          # `cyclonedx-json=sbom.cdx.json` made it report "No Syft output" after
          # a scan that had in fact succeeded. The misconfiguration was on main
          # and was masked there by `continue-on-error: true`; 0950383 removed
          # that mask, so from that commit the step failed visibly instead.
          format: "cyclonedx-json"
          # output-file writes into the workspace, which is what the blocking
          # upload step below reads. artifact-name alone only labels the
          # action's own artifact in the runner temp dir.
          output-file: "sbom.cdx.json"
          # The explicit upload step below owns retention, so do not let the
          # action publish a second copy with its own default retention.
          upload-artifact: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30
          # Default is `warn`, which would let a missing SBOM pass silently.
          if-no-files-found: error

  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Trivy (filesystem scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Blocking. Downgrading this control requires a registered, owned and
        # expiring entry in .github/security-exceptions.yml.
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

  semgrep:
    name: Semgrep Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/typescript
      # NOTE: this job does not currently produce SARIF. `generate-sarif` is not
      # an input of semgrep/semgrep-action@v1 (it warned "Unexpected input(s)"
      # and was ignored), and the action's `args` input is forwarded to
      # `docker run` as container arguments rather than appended to `semgrep ci`
      # -- passing --sarif there fails with `exec: "--sarif": executable file
      # not found in $PATH`. Emitting SARIF needs semgrep invoked directly.
      #
      # The scan itself is the gate and still fails on findings. The upload is
      # conditional so a missing report can never fail an otherwise clean job.
      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  test-shared-secrets:
    name: Shared Secrets Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install and smoke-test shared-secrets
        run: |
          python -m pip install -e ./shared
          python - <<'EOF'
          import os, tempfile
          from shared_secrets import read_secret, read_file_secret, MissingSecretError
          assert read_secret('CI_DISABLED', required=False, default='x') == 'x'
          try:
              read_secret('CI_SHOULD_NOT_EXIST_XYZ', required=True)
              raise SystemExit('required secret did not raise')
          except MissingSecretError:
              pass
          with tempfile.NamedTemporaryFile('w', delete=False) as fh:
              fh.write('secret-from-file')
              fh.flush()
          os.environ['CI_TEST_FILE'] = fh.name
          assert read_secret('CI_TEST') == 'secret-from-file'
          assert read_file_secret(fh.name) == 'secret-from-file'
          print('shared-secrets OK')
          EOF

  lint-runbooks:
    name: Runbook & Ops Script Freshness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Lint runbook freshness
        run: |
          python scripts/check-runbooks.py

      - name: Smoke-test the backup planner (dry run)
        env:
          TENANT_DATABASES_JSON: '{"org-a":{"db-1":"postgresql+asyncpg://drill:secret@host:5432/prod","db-2":"sqlite+aiosqlite:///:memory:"},"org-b":{"db-1":{"connection_string":"postgresql://read:secret@replica:5432/other","replica_connection_string":"postgresql://read:secret@replica:5432/other"}}}'
        run: |
          python3 -m py_compile scripts/backup-databases.py
          [ "$(python3 scripts/backup-databases.py --dry-run | grep -c '\[PLAN\]')" = "3" ] || exit 1
          [ "$(python3 scripts/backup-databases.py --dry-run --include-replicas | grep -c '\[PLAN\]')" = "4" ] || exit 1
          echo "backup planner resolves 3 targets by default, 4 with --include-replicas"

      - name: Syntax-check ops shell scripts
        run: |
          bash -n scripts/probe-production.sh
          bash -n scripts/incident-start.sh
          bash -n scripts/drills/drill-db-outage.sh
          bash -n scripts/drills/drill-rollback.sh
          bash -n scripts/drills/drill-restore.sh

  test-sql-query-api:
    name: SQL Query API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd sql_query_api
          python -m pip install --upgrade pip
          # Install exactly what the Dockerfiles install, via uv.lock. A bare
          # `pip install -e .` re-resolves to whatever is newest on PyPI, so
          # pip-audit graded a dependency set that is never shipped and the
          # lockfile stayed decorative.
          pip install "uv==0.12.22"
          uv export --locked --no-emit-project \
            --no-emit-package shared-secrets -o /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
          python -m pip install -e .
          # The locked export above already provides pytest, pytest-asyncio,
          # pytest-mock, httpx and aiosqlite. Installing them again unpinned
          # would upgrade the locked set and make pip-audit grade something
          # other than what the images ship. Only the scanners are added here.
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"

      - name: Run Bandit
        run: |
          cd sql_query_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd sql_query_api
          pytest

  test-auth0-api:
    name: Auth0 API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared-secrets dependency
        run: |
          python -m pip install -e ./shared

      - name: Install dependencies
        run: |
          cd auth0_api
          python -m pip install --upgrade pip
          # Install exactly what the Dockerfiles install, via uv.lock. A bare
          # `pip install -e .` re-resolves to whatever is newest on PyPI, so
          # pip-audit graded a dependency set that is never shipped and the
          # lockfile stayed decorative.
          pip install "uv==0.12.22"
          uv export --locked --no-emit-project \
            --no-emit-package shared-secrets -o /tmp/requirements.txt
          python -m pip install -r /tmp/requirements.txt
          python -m pip install -e .
          # See the SQL job above: the locked export already provides the test
          # tooling, so only the scanners are added here.
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"

      - name: Run Bandit
        run: |
          cd auth0_api
          bandit -r . -lll

      - name: Run pip-audit
        run: |
          pip-audit --desc

      - name: Run pytest
        run: |
          cd auth0_api
          pytest

  test-web-app:
    name: Web App Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-app/package-lock.json

      - name: Install web-app dependencies
        run: |
          cd web-app
          npm ci --ignore-scripts

      - name: Run npm audit (dependency vulnerability gate)
        run: |
          cd web-app
          npm audit --audit-level=moderate

      - name: Run lint
        run: |
          cd web-app
          npm run lint

      - name: Run tests
        run: |
          cd web-app
          npm test

      - name: Install Playwright browsers
        run: |
          cd web-app
          npx playwright install --with-deps chromium

      - name: Run E2E Playwright tests
        run: |
          cd web-app
          npm run test:e2e

      - name: Build web-app
        run: |
          cd web-app
          npm run build

  zap-dast:
    name: OWASP ZAP DAST Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    # No job-level `if:`, deliberately: every other security job here runs
    # unconditionally, and a control that silently skips is not a control.
    #
    # Blocking DAST against the real served web surface.
    #
    # This job used to be `continue-on-error: true` at both job and step level
    # and was registered as SEC-EXC-001. It never worked, and the reasons were
    # concrete rather than incidental:
    #   * `docker compose up` aborts because .env does not exist and
    #     creds-rotator's pg_rotator_admin_pass.txt is gitignored and absent.
    #   * mkcert cannot run unattended: `mkcert -install` writes the CA into the
    #     OS trust store and prompts for sudo.
    #   * `sleep 30` instead of waiting on real health.
    #   * `fail_action` defaults to false, so alerts never failed the job.
    #   * The upload step looked for zap-report.sarif, but the baseline scan
    #     emits report_json.json / report_md.md / report_html.html. That path
    #     never existed, so results were never published either.
    # All of that is fixed below, so SEC-EXC-001 is retired rather than renewed.
    #
    # ZAP itself runs with --network=host, so localhost:8443 is the runner's
    # published nginx port. Port 80 is not a useful target: it serves only
    # /nginx-health and 301s everything else to https, so a scan of :8080 would
    # exercise a single static endpoint.
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create CI-only env file with throwaway secrets
        run: |
          set -euo pipefail
          cp .env.example .env
          # The stack runs with ENVIRONMENT=production (from .env.example) so the
          # scan sees production security headers, HSTS and disabled GraphQL
          # introspection. Production mode makes the auth secrets mandatory, and
          # compose does not forward CI/GITHUB_ACTIONS into the containers, so
          # is_ci() is False there and the guards are not relaxed. These values
          # only need to be non-empty for the services to boot; nothing
          # authenticates against a real Auth0 tenant during a scan. They are
          # random per run and live only in this runner's gitignored .env.
          # Replace in place rather than appending. Compose takes the last
          # occurrence for a repeated key, but relying on that ordering is
          # fragile; these keys already exist in .env.example, often empty.
          set_env() {
            key="$1"; value="$2"
            if grep -qE "^${key}=" .env; then
              # Delimiter is | so values containing / stay intact.
              sed -i.bak -E "s|^${key}=.*|${key}=${value}|" .env && rm -f .env.bak
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
            grep -qE "^${key}=${value}$" .env || { echo "::error::failed to set $key"; exit 1; }
          }
          set_env APP_SECRET_KEY "$(openssl rand -hex 32)"
          set_env AUTH0_DOMAIN "dast.ci.invalid"
          set_env AUTH0_CLIENT_ID "dast-ci-client"
          set_env AUTH0_CLIENT_SECRET "$(openssl rand -hex 24)"
          set_env AUTH0_AUDIENCE "https://dast.ci.invalid/api"
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          grep -q "^ENVIRONMENT=production" .env

      - name: Generate self-signed TLS certificate
        run: |
          set -euo pipefail
          # mkcert is unusable here (see note above). ZAP is told to accept
          # certificate issues via cmd_options below, so a self-signed leaf is
          # enough to exercise the real TLS listener and its cipher/header
          # configuration. Valid for one day because it never leaves the runner.
          mkdir -p certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout certs/web_tls_key.pem \
            -out certs/web_tls_cert.pem \
            -subj "/CN=localhost" \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" 2>/dev/null
          # nginx runs with `cap_drop: ALL`, so its root has no DAC_OVERRIDE
          # and cannot read a 0600 file owned by another uid - which is what
          # openssl writes by default. Without this nginx crash-loops with
          # `cannot load certificate key ...: Permission denied`.
          # 644 is acceptable only because this is a throwaway one-day
          # self-signed leaf that never leaves the runner; a real deployment
          # must ship the key group-readable to nginx instead.
          chmod 644 certs/web_tls_key.pem
          openssl x509 -in certs/web_tls_cert.pem -noout -subject -dates

      - name: Create throwaway creds-rotator secret
        run: |
          set -euo pipefail
          # compose refuses to start when this gitignored file is missing. Write
          # it to the runner temp dir and point the overlay at it, so nothing is
          # created inside the repository working tree.
          printf '%s' "$(openssl rand -hex 24)" > "$RUNNER_TEMP/pg_rotator_admin_pass.txt"
          echo "PG_ROTATOR_ADMIN_PASS_FILE=$RUNNER_TEMP/pg_rotator_admin_pass.txt" >> "$GITHUB_ENV"

      - name: Start application stack for DAST
        run: |
          set -euo pipefail
          # Deliberately no --wait: creds-rotator exits non-zero on every start
          # (rotate_creds.sh needs jq, which postgres:16-alpine does not ship),
          # and --wait would turn that pre-existing breakage into a gate that
          # fails for reasons unrelated to DAST. The TLS-edge poll below is the
          # real readiness gate, and compose already orders startup with
          # depends_on: service_healthy.
          docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

      - name: Wait for the TLS edge to serve traffic
        run: |
          set -euo pipefail
          # Gate on the edge actually answering over TLS, which is the surface
          # ZAP will scan. nginx only starts once auth0_api and web_app report
          # healthy, so a 200 here means the whole request path is up.
          for attempt in $(seq 1 60); do
            if curl -sk --max-time 5 https://localhost:8443/nginx-health | grep -q OK; then
              echo "edge ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the TLS edge never became ready"
          docker compose -f docker-compose.yml -f docker-compose.test.yml ps
          docker compose -f docker-compose.yml -f docker-compose.test.yml logs --tail=60
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@66042c8e7e24680119199a017e5b0e8603bf4dae # v0.12.0
        with:
          target: "https://localhost:8443"
          # NOT yet enforcing. DAST runs, reports and self-verifies, but
          # enforcement is deferred one change cycle because the CI stack
          # bring-up has never executed and the self-signed test certificate is
          # expected to raise an SSL-certificate alert. Tracked in #194 and
          # registered as SEC-EXC-002 (expires 2026-10-16).
          fail_action: false
          # Do not open or update a GitHub issue on every run; the reports are
          # published as an artifact below instead.
          allow_issue_writing: false
          # Triaged suppressions, each with a written justification. Anything not
          # listed keeps ZAP's default WARN, which fail_action turns into a build
          # failure, so new alerts still block.
          rules_file_name: ".github/zap/baseline-rules.tsv"
          # The CI certificate is self-signed and ZAP cannot be given the CA
          # unattended, so TLS verification has to be skipped for the spider to
          # reach the target. `-a` (alpha passive rules) is deliberately NOT
          # used: those rules are unstable and would make a blocking gate fail
          # on churn.
          # The "Verify the scan actually crawled the target" step below is what
          # proves this option took effect. If it ever stops working, that step
          # fails instead of the job passing on an empty scan.
          cmd_options: '-z "-config http.ssl.insecureSkipVerify=true"'
          # Pinned by digest, not by the floating `stable` tag: the tag moves
          # under the build and a changed scanner silently changes what blocks.
          # Digest taken from ghcr.io's docker-content-digest header for the
          # 2.16.1 manifest. `docker manifest inspect` cannot confirm it from a
          # machine with no daemon, so a wrong digest would fail `docker pull`
          # and the scan would never run; the first CI run is that check.
          docker_name: "ghcr.io/zaproxy/zaproxy@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab"

      - name: Verify the scan actually crawled the target
        run: |
          set -euo pipefail
          # A blocking gate that scanned nothing is the exact failure SEC-EXC-001
          # was hiding: zap-baseline.py reports success when it crawled zero URLs,
          # so `fail_action: true` alone would happily go green on an empty scan.
          # This runs only when the scan step succeeded, which is precisely the
          # case that needs proving.
          # The action touches these files before scanning, so test -f would
          # always pass; test -s is the real check for a written report.
          test -s report_json.json || { echo "::error::ZAP wrote an empty report_json.json"; exit 1; }
          # `site` is populated from the report's site list; counting it proves
          # the scan reached something, and matching the host proves it reached
          # *our* target rather than some other host.
          matched=$(python3 -c 'import json;print(sum(1 for s in json.load(open("report_json.json")).get("site", []) if "localhost:8443" in str(s)))' 2>/dev/null) || {
            echo "::error::ZAP produced no parseable report_json.json"
            exit 1
          }
          echo "ZAP report has ${matched} site entry/entries on https://localhost:8443"
          if [ "${matched}" -lt 1 ]; then
            echo "::error::ZAP crawled no site on the target host; the scan is not covering the gateway"
            exit 1
          fi

      - name: Publish ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          # The baseline scan emits JSON, Markdown and HTML, not SARIF, so
          # codeql-action/upload-sarif was never given a file to read.
          path: |
            report_json.json
            report_md.md
            report_html.html
          retention-days: 30
          if-no-files-found: error

      - name: Tear down the DAST stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml down -v
