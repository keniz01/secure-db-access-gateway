repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
  # Custom Ruff hook - only checks changed lines (diff-aware)
  - repo: local
    hooks:
      - id: ruff-diff-check
        name: ruff (diff-aware check)
        description: Run Ruff linter only on changed lines
        # `language: system` runs this via the ambient PATH, where a bare
        # `python` does not exist on macOS/most runners — the hook died with
        # FileNotFoundError before ruff was ever invoked. python3 is the
        # portable spelling.
        #
        # The path is relative to the *git root*, not sql_query_api: pre-commit
        # always executes hooks with cwd set to the top-level repository root,
        # so a bare `.pre-commit-scripts/...` could never resolve. `ruff` itself
        # is still resolved from PATH by the script.
        entry: python3 sql_query_api/.pre-commit-scripts/ruff-diff-check.py
        language: system
        types: [python]
        pass_filenames: true
