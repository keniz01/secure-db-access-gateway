# Security control exception register.
#
# Every intentionally non-blocking security control in `.github/workflows/` must
# appear here with an owner, a reason, a tracking reference and an expiry date.
# `scripts/check-security-exceptions.py` enforces that:
#
#   1. Each entry carries a reason, an owner, a tracking reference, at least one
#      compensating control, and an ISO expiry date.
#   2. `expires` is in the future and no more than MAX_EXPIRY_DAYS out, so
#      "temporarily non-blocking" cannot quietly become permanent.
#   3. Every non-blocking control found in the workflows maps to a registered,
#      unexpired exception. A control can be downgraded only by registering the
#      downgrade, never by editing a single `continue-on-error: true`.
#   4. Registered exceptions must still correspond to a real non-blocking
#      control, so the register cannot accumulate dead entries.
#
# Each entry needs these fields:
#   id                     SEC-EXC-NNN, unique
#   control                job id, or `job/Step Name`, that is non-blocking
#   scope                  what exactly is not blocking
#   reason                 the decision record (>= 80 characters)
#   compensating_controls  what covers the gap meanwhile
#   owner                  who accepted the risk
#   tracking               where the remediation is tracked
#   expires                ISO date; must be in the future, <= 180 days out
#   status                 `accepted` (authorizes a downgrade) or `revoked`
#                          (documents history only; authorizes nothing)
#
# Renewing an exception requires a deliberate decision record: extend the date
# and note the re-review in `reason`, or make the control blocking and delete
# the entry.
#
# Accepted risks that are NOT CI gate downgrades (for example an architectural
# gap) belong in THREAT_MODEL.md, not here. This file is only for controls that
# exist but are configured not to block.
#
# SEC-EXC-001 is deleted: it covered a DAST job that had never worked. The
# replacement entry (SEC-EXC-002) covers only the remaining *enforcement* gap
# on a pipeline that does now boot, scan, publish reports and prove it crawled
# the target.
#
# Known limits of the check - it detects these downgrade markers and nothing
# else:
#   * step-level `continue-on-error: true`
#   * job-level `continue-on-error: true`
#   * Grype `fail-build: false` / Trivy `exit-code: "0"`
#   * ZAP `fail_action: false` (that action defaults to false, so omitting it is
#     itself a silent downgrade)
# It does NOT detect a downgrade expressed as `|| true`, an `if: always()`
# wrapper, or a step that is simply deleted. Removing a control is still a
# reviewable diff, but do not assume this register catches it.
version: 1

exceptions:
  - id: SEC-EXC-002
    control: zap-dast/Run OWASP ZAP Baseline Scan
    scope: >
      DAST enforcement only. The job boots the stack, waits on the TLS edge,
      runs the ZAP baseline scan, publishes JSON/MD/HTML reports and fails if it
      did not crawl the target. What it does not yet do is fail the build when
      the scan reports alerts.
    reason: >
      Enforcing and fixing the pipeline in one change would gamble on a runtime
      path that has never executed. docker-compose.test.yml is referenced only
      by this job, so three image builds, the nginx port merge, creds-rotator's
      missing jq, and the full service_healthy chain are unproven in CI. The
      target is also a self-signed one-day certificate, so ZAP's SSL Certificate
      Error passive rule is expected to fire; insecureSkipVerify only stops the
      spider aborting and does not suppress that alert. Pre-seeding it would be
      guessing. Run once, triage from real data, then enforce.
    compensating_controls:
      - "SAST: Semgrep, CodeQL and Bandit, all blocking"
      - "Dependency and image scanning: blocking pip-audit, Grype, Trivy, npm audit"
      - "The scan itself runs and its reports are published, so the results are reviewable even though they do not block"
    owner: Platform Security
    tracking: "https://github.com/keniz01/secure-db-access-gateway/issues/194"
    expires: "2026-10-16"
    status: accepted
