services:
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frontend
    depends_on:
      auth0_api:
        condition: service_healthy
      web_app:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  otel-lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4317:4317"
      - "4318:4318"
      - "9090:9090"
    environment:
      OTEL_SERVICE_NAME: read-only-database-explorer
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth0_api:
    build:
      context: .
      dockerfile: auth0_api/Dockerfile
    env_file: ${GATEWAY_ENV_FILE:-.env}
    environment:
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_DISABLE_REASONING: ${AI_DISABLE_REASONING:-true}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
      SQL_QUERY_API_URL: http://sql_query_api:8002/graphql
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,https://localhost:8443,http://web-app:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: auth0-api
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    networks:
      - frontend
      - backend
    depends_on:
      redis:
        condition: service_healthy
      sql_query_api:
        condition: service_healthy
      otel-lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  sql_query_api:
    build:
      context: .
      dockerfile: sql_query_api/Dockerfile
    env_file: ${GATEWAY_ENV_FILE:-.env}
    environment:
      SQL_DATA_SCHEMA: ${SQL_DATA_SCHEMA:-music}
      SQL_QUERY_COST_THRESHOLD: ${SQL_QUERY_COST_THRESHOLD:-16}
      SQL_PRESENTATION_ENABLED: ${SQL_PRESENTATION_ENABLED:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://openrouter.ai/api/v1}
      AI_DISABLE_REASONING: ${AI_DISABLE_REASONING:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://localhost:5173,https://localhost:8443}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
      OTEL_SERVICE_NAME: sql-query-api
      OPA_URL: ${OPA_URL:-http://opa:8181}
      OPA_ENABLED: ${OPA_ENABLED:-false}
    networks:
      - backend
    depends_on:
      otel-lgtm:
        condition: service_healthy
      opa:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=3).read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  opa:
    image: openpolicyagent/opa:latest
    expose:
      - "8181"
    volumes:
      - ./sql_query_api/opa/policies:/etc/opa/policies:ro
      - ./sql_query_api/opa/data.json:/etc/opa/data.json:ro
      - ./sql_query_api/opa/config.yaml:/etc/opa/config.yaml:ro
    networks:
      - backend
    # Dev: file mount (policies + data.json). Prod bundle mode: override
    # command to `run --config-file /etc/opa/config.yaml` and set
    # BUNDLE_SERVICE_URL. See sql_query_api/opa/config.yaml + scripts/build-opa-bundle.sh
    command:
      - "run"
      - "--server"
      - "--addr=:8181"
      - "--log-level=info"
      - "/etc/opa/policies"
      - "/etc/opa/data.json"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # Optional bundle server for OPA hot-reload (prod). Serves bundle.tar.gz
  # built by `scripts/build-opa-bundle.sh`. Enable by uncommenting and
  # setting OPA to bundle mode (see docker-compose.prod.yml).
  # opa-bundle-server:
  #   image: nginx:alpine
  #   expose:
  #     - "8080"
  #   networks:
  #     - backend
  #   volumes:
  #     - ./sql_query_api/bundle.tar.gz:/usr/share/nginx/html/bundle.tar.gz:ro
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/bundle.tar.gz"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  web_app:
    build: ./web-app
    environment:
      VITE_API_BASE_URL: https://localhost:8443
      VITE_SQL_GRAPHQL_BASE_URL: https://localhost:8443/api/graphql
    networks:
      - frontend
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    depends_on:
      - auth0_api

networks:
  frontend:
    name: gateway-frontend
    driver: bridge
  backend:
    name: gateway-backend
    driver: bridge
    # Note: not `internal: true` — sql_query_api needs egress to
    # host.docker.internal:5432 (Postgres) and openrouter.ai, and OPA
    # needs egress for bundle fetches (S3/GCS). Isolation is via
    # network membership (web_app/frontend cannot reach backend) rather
    # than blocking all external egress.

# volumes:
#   postgres_data:

# Secrets are injected as environment variables from a single env file
# (GATEWAY_ENV_FILE, default .env) that never enters version control. There are
# no secret files in this repository. Copy .env.example to .env (dev) or to
# /etc/gateway/gateway.env (production) and fill in real values manually.