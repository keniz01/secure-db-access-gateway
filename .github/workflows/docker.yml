name: Build and Push Images

# Build and push edge/SHA images on main; an optional tag is available via
# workflow_dispatch. Release builds use the same pinned builder from deploy.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit GHCR tag to push (default: edge + sha-<commit>)"
        required: false
        type: string

permissions: {}

jobs:
  build:
    name: Build and push images
    uses: ./.github/workflows/docker-builder.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
