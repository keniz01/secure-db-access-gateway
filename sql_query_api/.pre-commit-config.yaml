repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements
  # Custom Ruff hook - only checks changed lines (diff-aware)
  - repo: local
    hooks:
      - id: ruff-diff-check
        name: ruff (diff-aware check)
        description: Run Ruff linter only on changed lines
        entry: python .pre-commit-scripts/ruff-diff-check.py
        language: system
        types: [python]
        pass_filenames: true
